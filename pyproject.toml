[project]
name = "novelcrawl"
version = "0.2.0"
description = "支持 SQLite 断点续传、刷新、导出与跨来源合并的小说下载器"
authors = [
    { name = "铂屑", email = "80164656+boxie123@users.noreply.github.com" },
]
dependencies = ["lxml>=6.0.0", "beautifulsoup4>=4.13.4", "playwright>=1.53.0", "playwright-stealth>=2.0.0"]
readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["novelcrawl"]

[project.scripts]
novelcrawl = "novelcrawl.cli:main"
